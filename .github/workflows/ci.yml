name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22.22.2'
          - os: windows-latest
            node: '22.22.2'
          - os: macos-latest
            node: '22.22.2'
          - os: ubuntu-latest
            node: '24.19.0'
          - os: windows-latest
            node: '24.19.0'
          - os: macos-latest
            node: '24.19.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check

  package-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - run: npm run check:reproducible

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [verify, package-reproducibility]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every CI dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node -e "const needs=JSON.parse(process.env.NEEDS_JSON);const failed=Object.entries(needs).filter(([,v])=>v.result!=='success');if(failed.length){console.error('CI Gate blocked:',failed.map(([k,v])=>k+'='+v.result).join(', '));process.exit(1)}"
