name: Family Release Guard

on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      expected_core_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Verify exact Trust Root and family governance
        env:
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_core_sha must be exact'; exit 2; }
          pinned="$(git ls-files --stage src/codex-safe-core | awk '{print $2}')"
          test "$pinned" = "$EXPECTED_CORE_SHA" || { echo "$PRODUCT pins $pinned, expected $EXPECTED_CORE_SHA"; exit 2; }
          node src/codex-safe-core/scripts/verify-actions-pins.js .github/workflows
          node src/codex-safe-core/scripts/verify-non-goals.js .
          node src/codex-safe-core/scripts/family-diagnostics.js > FAMILY_DIAGNOSTICS.json
          node -e "const d=require('./FAMILY_DIAGNOSTICS.json'); if(d.coreSha!==process.env.EXPECTED_CORE_SHA) throw new Error('diagnostics/core pin drift');"
