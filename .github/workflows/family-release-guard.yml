name: Family Release Guard

on:
  workflow_call:
    secrets:
      CODEX_SAFE_FAMILY_READ_TOKEN:
        required: false
    inputs:
      product:
        required: true
        type: string
      expected_core_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ github.token }}
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
      - name: Verify exact released Trust Root, server Rulesets and family governance
        env:
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          PRODUCT: ${{ inputs.product }}
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_CORE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_core_sha must be exact'; exit 2; }
          pinned="$(git ls-files --stage src/codex-safe-core | awk '{print $2}')"
          test "$pinned" = "$EXPECTED_CORE_SHA" || { echo "$PRODUCT pins $pinned, expected $EXPECTED_CORE_SHA"; exit 2; }
          node src/codex-safe-core/scripts/verify-released-core.js "$EXPECTED_CORE_SHA"
          node src/codex-safe-core/scripts/verify-consumer-product-contract.js "$EXPECTED_CORE_SHA" "$PRODUCT"
          node src/codex-safe-core/scripts/verify-consumer-release-bump.js
          node src/codex-safe-core/scripts/verify-actions-pins.js .github/workflows
          node src/codex-safe-core/scripts/verify-non-goals.js .
          node src/codex-safe-core/scripts/family-diagnostics.js > FAMILY_DIAGNOSTICS.json
          node -e "const d=require('./FAMILY_DIAGNOSTICS.json'); if(d.coreSha!==process.env.EXPECTED_CORE_SHA) throw new Error('diagnostics/core pin drift');"

private-governance:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
      - name: Admit only an immutable released Core commit without private credentials
        env:
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const expected=String(process.env.EXPECTED_CORE_SHA||'');
          if(!/^[0-9a-f]{40}$/.test(expected))throw Error('Expected Core commit must be an exact SHA.');
          const repo='jiying2007/codex-safe-core';
          async function json(endpoint){
            const response=await fetch(`https://api.github.com/repos/${repo}/${endpoint}`,{
              headers:{accept:'application/vnd.github+json','user-agent':'codex-safe-immutable-core-admission'},
              redirect:'error',signal:AbortSignal.timeout(15000)
            });
            if(!response.ok)throw Error(`Public immutable Core evidence unavailable (HTTP ${response.status}).`);
            return response.json();
          }
          (async()=>{
            const releases=await json('releases?per_page=100');
            if(!Array.isArray(releases))throw Error('Immutable Core release listing is invalid.');
            for(const release of releases){
              if(release.immutable!==true||release.draft||release.prerelease||!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(release.tag_name||''))continue;
              const ref=await json(`git/ref/tags/${encodeURIComponent(release.tag_name)}`);
              let object=ref.object;
              if(object?.type==='tag')object=(await json(`git/tags/${object.sha}`)).object;
              if(object?.type==='commit'&&object.sha===expected){
                process.stdout.write(`Trusted immutable Core release ${release.tag_name} resolves to exact ${expected}\n`);
                return;
              }
            }
            throw Error('Target Core SHA is not admitted by any immutable final release; private read token will not be exposed.');
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - name: Checkout only immutable trusted Core source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/codex-safe-core
          ref: ${{ inputs.expected_core_sha }}
          persist-credentials: false
      - name: Verify actual family Rulesets with scoped private read identity
        env:
          GITHUB_TOKEN: ${{ secrets.CODEX_SAFE_FAMILY_READ_TOKEN || github.token }}
        run: node scripts/verify-repository-ruleset.js
