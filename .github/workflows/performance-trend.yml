name: Performance Trend

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 1'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Run broad performance budget and snapshot
        run: |
          node --test test/performance-budget.test.js
          node scripts/write-performance-snapshot.js PERFORMANCE_SNAPSHOT.json
      - name: Compare with previous immutable snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          short="${GITHUB_SHA:0:12}"
          current_tag="codex-safe-performance-v${core_version}-${short}"
          previous_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("codex-safe-performance-v")) | .tag_name' | grep -Fvx "$current_tag" | head -n1 || true)"
          if [[ -n "$previous_tag" ]]; then
            mkdir -p previous
            gh release download "$previous_tag" --pattern 'performance-*.json' --dir previous
            previous="$(find previous -maxdepth 1 -type f -name 'performance-*.json' -print -quit)"
            test -n "$previous" || { echo "No performance snapshot asset found in ${previous_tag}." >&2; exit 1; }
            node scripts/compare-performance-snapshot.js PERFORMANCE_SNAPSHOT.json "$previous"
          fi
      - id: evidence
        name: Prepare immutable performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          short="${GITHUB_SHA:0:12}"
          asset="performance-${short}.json"
          tag="codex-safe-performance-v${core_version}-${short}"
          mv PERFORMANCE_SNAPSHOT.json "$asset"
          exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
      - name: Attest performance snapshot provenance
        if: steps.evidence.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.asset }}
      - name: Persist and verify immutable performance snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_TAG: ${{ steps.evidence.outputs.tag }}
          PERFORMANCE_ASSET: ${{ steps.evidence.outputs.asset }}
          PERFORMANCE_EXISTS: ${{ steps.evidence.outputs.exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PERFORMANCE_EXISTS" == true ]]; then
            echo "immutable performance evidence already exists: $PERFORMANCE_TAG"
            rm -f "$PERFORMANCE_ASSET"
            gh release download "$PERFORMANCE_TAG" --pattern "$PERFORMANCE_ASSET" --dir .
          else
            core_version="$(node -p "require('./core-contract.json').coreVersion")"
            short="${GITHUB_SHA:0:12}"
            gh release create "$PERFORMANCE_TAG" "$PERFORMANCE_ASSET" --target "$GITHUB_SHA" --title "Codex Safe performance ${core_version} ${short}" --notes "Immutable broad performance regression snapshot for one exact Core commit."
          fi
          immutable=false
          for attempt in {1..12}; do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PERFORMANCE_TAG}" --jq '.immutable')"
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || { echo "Performance release ${PERFORMANCE_TAG} is not immutable." >&2; exit 1; }
          release_verified=false
          for attempt in {1..12}; do
            if gh release verify "$PERFORMANCE_TAG"; then
              release_verified=true
              break
            fi
            echo "Performance release attestation for ${PERFORMANCE_TAG} is not visible yet (attempt ${attempt}/12)." >&2
            sleep 5
          done
          test "$release_verified" = true || { echo "Performance release ${PERFORMANCE_TAG} attestation did not become verifiable." >&2; exit 1; }
          gh release verify-asset "$PERFORMANCE_TAG" "$PERFORMANCE_ASSET"
