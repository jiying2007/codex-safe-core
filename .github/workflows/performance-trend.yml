name: Performance Trend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/*performance*'
      - '.github/workflows/performance-trend.yml'
  schedule:
    - cron: '29 4 * * 1'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main' && github.repository == 'jiying2007/codex-safe-core'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
      - id: baseline
        name: Resolve an immutable released ancestor for same-runner sampling
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/paired-performance-snapshot.js resolve "$RUNNER_TEMP/core-performance-baseline" PERFORMANCE_BASELINE.json
      - name: Run broad performance budget
        run: node --test test/performance-budget.test.js
      - name: Generate paired snapshot even after broad-test failure
        if: ${{ always() && steps.baseline.outcome == 'success' }}
        run: node scripts/paired-performance-snapshot.js measure "$RUNNER_TEMP/core-performance-baseline" PERFORMANCE_BASELINE.json PERFORMANCE_SNAPSHOT.json
      # Save bounded raw data before the strict comparison can fail. This is not
      # an immutable release or an admission receipt; it is failure diagnosis.
      - name: Preserve exact-run raw samples before strict comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-raw-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            PERFORMANCE_SNAPSHOT.json
            PERFORMANCE_BASELINE.json
          if-no-files-found: error
          retention-days: 30
      - name: Compare baseline and candidate measured in this job
        run: node scripts/paired-performance-snapshot.js verify PERFORMANCE_SNAPSHOT.json "$GITHUB_SHA"
      - id: evidence
        name: Prepare immutable performance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          short="${GITHUB_SHA:0:12}"
          asset="performance-${short}.json"
          tag="codex-safe-performance-v${core_version}-${short}"
          mv PERFORMANCE_SNAPSHOT.json "$asset"
          exists=false
          if gh release view "$tag" >/dev/null 2>&1; then
            exists=true
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
      - name: Attest performance snapshot provenance
        if: steps.evidence.outputs.exists != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.evidence.outputs.asset }}
      - name: Persist and verify immutable performance snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_TAG: ${{ steps.evidence.outputs.tag }}
          PERFORMANCE_ASSET: ${{ steps.evidence.outputs.asset }}
          PERFORMANCE_EXISTS: ${{ steps.evidence.outputs.exists }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PERFORMANCE_EXISTS" == true ]]; then
            echo "immutable performance evidence already exists: $PERFORMANCE_TAG"
            rm -f "$PERFORMANCE_ASSET"
            gh release download "$PERFORMANCE_TAG" --pattern "$PERFORMANCE_ASSET" --dir .
            node scripts/paired-performance-snapshot.js verify "$PERFORMANCE_ASSET" "$GITHUB_SHA"
          else
            core_version="$(node -p "require('./core-contract.json').coreVersion")"
            short="${GITHUB_SHA:0:12}"
            gh release create "$PERFORMANCE_TAG" "$PERFORMANCE_ASSET" --latest=false --target "$GITHUB_SHA" --title "Codex Safe performance ${core_version} ${short}" --notes "Immutable paired performance evidence: one harness, alternating isolated processes, and the released baseline and candidate on the same runner. Seven-sample maxima are diagnostic only; this is not model quality or token-savings evidence."
          fi
          immutable=false
          for attempt in {1..12}; do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PERFORMANCE_TAG}" --jq '.immutable')"
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || { echo "Performance release ${PERFORMANCE_TAG} is not immutable." >&2; exit 1; }
          release_verified=false
          for attempt in {1..12}; do
            if gh release verify "$PERFORMANCE_TAG"; then
              release_verified=true
              break
            fi
            echo "Performance release attestation for ${PERFORMANCE_TAG} is not visible yet (attempt ${attempt}/12)." >&2
            sleep 5
          done
          test "$release_verified" = true || { echo "Performance release ${PERFORMANCE_TAG} attestation did not become verifiable." >&2; exit 1; }
          gh release verify-asset "$PERFORMANCE_TAG" "$PERFORMANCE_ASSET"
