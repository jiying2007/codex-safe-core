name: Performance Trend

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * 1'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Run broad performance budget and snapshot
        run: |
          node --test test/performance-budget.test.js
          node scripts/write-performance-snapshot.js PERFORMANCE_SNAPSHOT.json
      - name: Compare with previous immutable snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          short="${GITHUB_SHA:0:12}"
          current_tag="codex-safe-performance-v${core_version}-${short}"
          previous_tag="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name | startswith("codex-safe-performance-v")) | .tag_name' | grep -Fvx "$current_tag" | head -n1 || true)"
          if [[ -n "$previous_tag" ]]; then
            mkdir -p previous
            gh release download "$previous_tag" --pattern 'performance-*.json' --dir previous
            previous="$(find previous -maxdepth 1 -type f -name 'performance-*.json' -print -quit)"
            test -n "$previous" || { echo "No performance snapshot asset found in ${previous_tag}." >&2; exit 1; }
            node scripts/compare-performance-snapshot.js PERFORMANCE_SNAPSHOT.json "$previous"
          fi
      - name: Persist one immutable performance snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          short="${GITHUB_SHA:0:12}"
          asset="performance-${short}.json"
          mv PERFORMANCE_SNAPSHOT.json "$asset"
          tag="codex-safe-performance-v${core_version}-${short}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "immutable performance evidence already exists: $tag"
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "Codex Safe performance ${core_version} ${short}" --notes "Immutable broad performance regression snapshot for one exact Core commit."
          fi
          immutable=false
          for attempt in {1..12}; do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')"
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || { echo "Performance release ${tag} is not immutable." >&2; exit 1; }
          gh release verify "$tag"
          gh release verify-asset "$tag" "$asset"
