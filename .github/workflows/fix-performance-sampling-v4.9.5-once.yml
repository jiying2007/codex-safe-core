name: Fix performance sampling v4.9.5 once
on:
  push:
permissions:
  contents: write
jobs:
  patch:
    if: github.ref == 'refs/heads/fix-performance-sampling-v4.9.5'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-performance-sampling-v4.9.5
          persist-credentials: true
      - name: Harden performance trend sampling
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/write-performance-snapshot.js <<'JS'
          'use strict';
          const fs=require('node:fs');
          const {spawnSync}=require('node:child_process');
          const {performance}=require('node:perf_hooks');
          const {buildReviewEvidenceChunks,buildSemanticContext,splitUnifiedDiff}=require('../context-builder');
          const {estimateRequestTokens,scoreEvidenceRisk,selectChunksWithinByteBudget}=require('../efficiency-planner');
          const {buildImpactEvidenceGraph}=require('../quality-platform');
          const SAMPLE_COUNT=7;
          const STRUCTURAL_KEYS=Object.freeze(['evidenceChunks','evidenceInputBytes','contextInputBytes','impactNodes','impactBytes','estimatedTokens','risk','plannedBytes']);
          function largeDiff(targetBytes=4*1024*1024){const blocks=[];let bytes=0,index=0;while(bytes<targetBytes){const body=`diff --git a/src/file-${index}.js b/src/file-${index}.js\n--- a/src/file-${index}.js\n+++ b/src/file-${index}.js\n@@ -1,3 +1,4 @@\n-old ${'x'.repeat(512)}\n+import { helper } from './helper.js';\n+function changed_${index}(){ return helper(); }\n+new ${'y'.repeat(512)}\n context\n`;blocks.push(body);bytes+=Buffer.byteLength(body);index++;}return blocks.join('');}
          function median(values){const sorted=values.map(Number).sort((a,b)=>a-b),mid=Math.floor(sorted.length/2);if(!sorted.length)throw new Error('median requires samples');return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;}
          function measure(){const diff=largeDiff(),before=process.memoryUsage().rss,started=performance.now();const evidence=buildReviewEvidenceChunks({diff,maxBytes:512*1024,maxChunks:8});const context=buildSemanticContext({diff,maxBytes:512*1024});const estimate=estimateRequestTokens(context.text,{estimatedOutputTokens:1024});const risk=scoreEvidenceRisk({paths:context.sourceFiles,text:context.text});const planned=selectChunksWithinByteBudget(evidence.chunks,1024*1024);const candidates=splitUnifiedDiff(diff).slice(0,64).map(block=>({path:block.path,content:block.text}));const impact=buildImpactEvidenceGraph({diff,candidates,maxNodes:32,maxEdges:96,maxBytes:128*1024});return{elapsedMs:Number((performance.now()-started).toFixed(3)),rssGrowthBytes:Math.max(0,process.memoryUsage().rss-before),evidenceChunks:evidence.chunks?.length||0,evidenceInputBytes:evidence.inputDiffBytes,contextInputBytes:context.inputDiffBytes,impactNodes:impact.nodes.length,impactBytes:impact.bytes,estimatedTokens:estimate.totalTokens,risk,plannedBytes:planned.bytes};}
          function summarizeSamples(samples){if(samples.length<3||samples.length%2===0)throw new Error('performance sampling requires an odd sample count >= 3');const first=samples[0];for(const sample of samples)for(const key of STRUCTURAL_KEYS)if(sample[key]!==first[key])throw new Error(`performance sample structural drift for ${key}`);return{...Object.fromEntries(STRUCTURAL_KEYS.map(key=>[key,first[key]])),elapsedMs:Number(median(samples.map(s=>s.elapsedMs)).toFixed(3)),rssGrowthBytes:Math.round(median(samples.map(s=>s.rssGrowthBytes)))};}
          function collectSamples(count=SAMPLE_COUNT){const samples=[];for(let i=0;i<count;i++){const result=spawnSync(process.execPath,[__filename,'--single-sample'],{encoding:'utf8',env:process.env,maxBuffer:1024*1024});if(result.status!==0)throw new Error(result.stderr||result.stdout||`performance sample ${i+1} failed`);const line=result.stdout.trim().split(/\r?\n/).filter(Boolean).at(-1);samples.push(JSON.parse(line));}return samples;}
          function buildSnapshot(samples=collectSamples()){const metrics=summarizeSamples(samples),out={schemaVersion:3,coreVersion:require('../core-contract.json').coreVersion,coreSha:process.env.GITHUB_SHA||null,node:process.version,platform:process.platform,workload:{inputDiffBytes:metrics.evidenceInputBytes,maxEvidenceBytes:512*1024,maxChunks:8,maxImpactBytes:128*1024},sampling:{method:'median-isolated-process',count:samples.length,elapsedMs:samples.map(s=>s.elapsedMs),rssGrowthBytes:samples.map(s=>s.rssGrowthBytes)},metrics,budgets:{elapsedMs:5000,rssGrowthBytes:256*1024*1024},recordedAt:new Date().toISOString()};if(metrics.elapsedMs>=out.budgets.elapsedMs||metrics.rssGrowthBytes>=out.budgets.rssGrowthBytes)throw new Error('performance snapshot exceeds broad regression budget');return out;}
          function main(){if(process.argv.includes('--single-sample')){process.stdout.write(`${JSON.stringify(measure())}\n`);return;}const out=buildSnapshot(),file=process.argv[2]||'PERFORMANCE_SNAPSHOT.json';fs.writeFileSync(file,JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out.metrics));}
          if(require.main===module)main();
          module.exports={SAMPLE_COUNT,STRUCTURAL_KEYS,largeDiff,median,measure,summarizeSamples,collectSamples,buildSnapshot};
          JS
          cat > scripts/compare-performance-snapshot.js <<'JS'
          #!/usr/bin/env node
          'use strict';
          const fs=require('node:fs');
          const {comparePerformanceSnapshot}=require('../quality-platform');
          function compareSnapshots(current,baseline){const currentSchema=Number(current.schemaVersion||0),baselineSchema=Number(baseline.schemaVersion||0);const currentMetrics=current.metrics||{},baselineMetrics=baseline.metrics||{};const broadOk=Number(currentMetrics.elapsedMs||Infinity)<Number(current.budgets?.elapsedMs||5000)&&Number(currentMetrics.rssGrowthBytes||Infinity)<Number(current.budgets?.rssGrowthBytes||256*1024*1024);if(!broadOk)return{ok:false,migration:false,reason:'broad_budget'};if(currentSchema>=3&&baselineSchema<3)return{ok:true,migration:true,reason:'legacy_single_sample_baseline',result:null};const result=comparePerformanceSnapshot({latencyMs:Number(currentMetrics.elapsedMs||0),rssBytes:Number(currentMetrics.rssGrowthBytes||0)},{latencyMs:Number(baselineMetrics.elapsedMs||0),rssBytes:Number(baselineMetrics.rssGrowthBytes||0)},{latencyRegressionPct:10,rssRegressionPct:10,artifactRegressionPct:5});return{ok:result.ok,migration:false,reason:result.ok?'within_regression_budget':'regression',result};}
          function main(){const[currentFile,baselineFile]=process.argv.slice(2);if(!currentFile||!baselineFile)throw new Error('Usage: node scripts/compare-performance-snapshot.js CURRENT BASELINE');const current=JSON.parse(fs.readFileSync(currentFile,'utf8')),baseline=JSON.parse(fs.readFileSync(baselineFile,'utf8')),comparison=compareSnapshots(current,baseline),payload={ok:comparison.ok,comparison,current:current.metrics,baseline:baseline.metrics};(comparison.ok?process.stdout:process.stderr).write(`${JSON.stringify(payload,null,2)}\n`);if(!comparison.ok)process.exit(1);}
          if(require.main===module)main();
          module.exports={compareSnapshots};
          JS
          chmod +x scripts/compare-performance-snapshot.js
          cat > test/performance-snapshot.test.js <<'JS'
          'use strict';
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const{median,summarizeSamples}=require('../scripts/write-performance-snapshot');
          const{compareSnapshots}=require('../scripts/compare-performance-snapshot');
          const base={elapsedMs:100,rssGrowthBytes:1000,evidenceChunks:8,evidenceInputBytes:4194330,contextInputBytes:4194330,impactNodes:32,impactBytes:39340,estimatedTokens:497856,risk:2,plannedBytes:1046730};
          test('performance snapshots use a stable odd-sample median',()=>{assert.equal(median([180,120,150,140,160,130,170]),150);const samples=[90,100,110,95,105,120,80].map((elapsedMs,index)=>({...base,elapsedMs,rssGrowthBytes:1000+index*10}));const out=summarizeSamples(samples);assert.equal(out.elapsedMs,100);assert.equal(out.rssGrowthBytes,1030);});
          test('performance samples fail closed on structural drift',()=>{const samples=Array.from({length:7},()=>({...base}));samples[3]={...samples[3],plannedBytes:123};assert.throws(()=>summarizeSamples(samples),/structural drift/);});
          test('schema v3 migration does not compare median against legacy single sample',()=>{const current={schemaVersion:3,metrics:{elapsedMs:180,rssGrowthBytes:1000},budgets:{elapsedMs:5000,rssGrowthBytes:100000}},legacy={schemaVersion:2,metrics:{elapsedMs:140,rssGrowthBytes:1000}};assert.deepEqual(compareSnapshots(current,legacy),{ok:true,migration:true,reason:'legacy_single_sample_baseline',result:null});});
          test('schema v3 keeps median-to-median relative regression gate',()=>{const current={schemaVersion:3,metrics:{elapsedMs:112,rssGrowthBytes:1000},budgets:{elapsedMs:5000,rssGrowthBytes:100000}},baseline={schemaVersion:3,metrics:{elapsedMs:100,rssGrowthBytes:1000}};assert.equal(compareSnapshots(current,baseline).ok,false);});
          JS
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version='4.9.5';if(!pkg.scripts.test.includes('test/performance-snapshot.test.js'))pkg.scripts.test=pkg.scripts.test.replace('test/performance-budget.test.js','test/performance-budget.test.js test/performance-snapshot.test.js');fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('core-contract.json','utf8'));contract.coreVersion='4.9.5';fs.writeFileSync('core-contract.json',JSON.stringify(contract,null,2)+'\n');
          for(const p of ['docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md','docs/EFFICIENCY_CONTRACT.md','docs/EFFICIENCY_CONTRACT.zh-CN.md']){let s=fs.readFileSync(p,'utf8').replaceAll('4.9.4','4.9.5');fs.writeFileSync(p,s);}
          let c=fs.readFileSync('CHANGELOG.md','utf8');const e=`## 4.9.5 - 2026-08-30\n\n### Performance trend sampling reliability\n\n- Replace single-run wall-clock/RSS trend evidence with seven isolated-process samples and median aggregation while keeping the existing broad absolute budgets.\n- Fail closed if deterministic workload structure drifts across samples.\n- Treat the first schema v3 snapshot as an explicit migration from legacy schema v2 single-sample evidence; relative 10% regression gating resumes median-to-median once both snapshots are v3.\n- Keep all Safe Contract, policy, receipt, quality, provider and consumer product semantics unchanged.\n\n`;if(!c.startsWith('# Changelog\n\n'))throw new Error('unexpected changelog');fs.writeFileSync('CHANGELOG.md','# Changelog\n\n'+e+c.slice('# Changelog\n\n'.length));
          NODE
          node scripts/write-performance-snapshot.js /tmp/perf.json
          node --test test/performance-snapshot.test.js test/performance-budget.test.js
          npm run check:syntax
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add scripts/write-performance-snapshot.js scripts/compare-performance-snapshot.js test/performance-snapshot.test.js package.json core-contract.json docs/QUALITY_PLATFORM.md docs/QUALITY_PLATFORM.zh-CN.md docs/EFFICIENCY_CONTRACT.md docs/EFFICIENCY_CONTRACT.zh-CN.md CHANGELOG.md
          git commit -m 'fix(core): stabilize performance trend evidence in v4.9.5'
          git push origin HEAD:fix-performance-sampling-v4.9.5
