name: One-shot Change Safe Family bootstrap
on:
  push:
    branches: [chore/change-safe-family-v4.9.7]
permissions:
  contents: write
jobs:
  bootstrap:
    if: ${{ github.event.head_commit.message == 'chore: bootstrap Change Safe family governance' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Apply deterministic Family v4.9.7 governance patch
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const writeJson=(file,mutate)=>{const x=JSON.parse(fs.readFileSync(file,'utf8'));mutate(x);fs.writeFileSync(file,JSON.stringify(x,null,2)+'\n');};
          const replace=(file,from,to)=>{let s=fs.readFileSync(file,'utf8');if(!s.includes(from))throw new Error(`${file}: expected text not found: ${from.slice(0,100)}`);s=s.replace(from,to);fs.writeFileSync(file,s);};
          writeJson('package.json',x=>x.version='4.9.7');
          writeJson('core-contract.json',x=>x.coreVersion='4.9.7');
          writeJson('family-workspace-manifest.json',x=>{
            x.activeConsumers=[
              {name:'Codex Change Safe',path:'codex-pr',safeCorePath:'src/codex-safe-core',contractPath:'product-contract.json'},
              ...x.activeConsumers
            ];
            x.retiredProducts=[{name:'Codex PR Safe',extensionId:'jiying2007.codex-pr-safe'}];
          });
          replace('scripts/resolve-family-snapshot.js',"const CONSUMERS=Object.freeze(['codex-commit','codex-review','codex-review-service','codex-diagnose']);","const CONSUMERS=Object.freeze(['codex-pr','codex-commit','codex-review','codex-review-service','codex-diagnose']);");
          replace('scripts/verify-consumer-boundaries.js',"const repos=['codex-commit','codex-review','codex-review-service','codex-diagnose'];","const repos=['codex-pr','codex-commit','codex-review','codex-review-service','codex-diagnose'];");
          replace('.github/workflows/family-ci.yml','for repo in codex-commit codex-review codex-review-service codex-diagnose; do','for repo in codex-pr codex-commit codex-review codex-review-service codex-diagnose; do');
          replace('.github/workflows/family-ci.yml','node scripts/family-golden.js family/codex-commit/src/codex-safe-core family/codex-review/src/codex-safe-core family/codex-review-service/src/codex-safe-core family/codex-diagnose/src/codex-safe-core','node scripts/family-golden.js family/codex-pr/src/codex-safe-core family/codex-commit/src/codex-safe-core family/codex-review/src/codex-safe-core family/codex-review-service/src/codex-safe-core family/codex-diagnose/src/codex-safe-core');
          replace('.github/workflows/family-ci.yml','for repo in codex-commit codex-review codex-review-service codex-diagnose; do','for repo in codex-pr codex-commit codex-review codex-review-service codex-diagnose; do');
          replace('.github/workflows/family-upgrade.yml','for repo in codex-commit codex-review codex-review-service codex-diagnose; do','for repo in codex-pr codex-commit codex-review codex-review-service codex-diagnose; do');
          replace('test/product-docs.test.js',"for (const product of ['Codex Review Safe', 'Codex Commit Safe', 'Codex Review Service', 'Codex Diagnose Safe'])","for (const product of ['Codex Review Safe', 'Codex Commit Safe', 'Codex Change Safe', 'Codex Review Service', 'Codex Diagnose Safe'])");
          replace('test/product-docs.test.js',"assert.match(text, /Codex PR Safe[^\\n]{0,80}(?:retired|已退役)/i);","assert.match(text, /Codex PR Safe[^\\n]{0,120}(?:retired|已退役)/i);\n  assert.match(text, /Codex Change Safe/);");
          let readme=fs.readFileSync('README.md','utf8');
          readme=readme.replace('| [Codex Review Service](https://github.com/jiying2007/codex-review-service) | Self-hosted GitLab Self-Managed MR review, publication, gate and audit |','| [Codex Change Safe](https://github.com/jiying2007/codex-pr) | Developer-side GitHub/GitLab delivery authorization, merge readiness and Change Receipt v1 |\n| [Codex Review Service](https://github.com/jiying2007/codex-review-service) | Self-hosted GitLab Self-Managed MR review, publication, gate and audit |');
          readme=readme.replace('**Codex PR Safe is retired.** There is no replacement PR/MR-description generator. PR/MR creation and metadata stay with the SCM\'s native UI/CLI/API, and Codex Commit Safe intentionally does not generate PR/MR descriptions.','**Codex PR Safe is retired.** Its model-generated PR-description identity is not restored. **Codex Change Safe** is the successor delivery product: deterministic GitHub/GitLab PR/MR authorization and merge readiness with zero model calls by default.');
          readme=readme.replace('Use Codex Review Safe for developer-side pre-commit review, Codex Commit Safe for commit-message generation, Codex Review Service for server-side GitLab MR review, and Codex Diagnose Safe for failed CI/build/test diagnosis.','Use Codex Review Safe for developer-side pre-commit review, Codex Commit Safe for commit-message generation, Codex Change Safe for developer-side PR/MR delivery authorization, Codex Review Service for server-side GitLab MR review, and Codex Diagnose Safe for failed CI/build/test diagnosis.');
          readme=readme.replace('A Core change is not complete until all four active consumers are coordinated-repinned','A Core change is not complete until all five active consumers are coordinated-repinned');
          readme=readme.replace('The existing `quick`, `standard`, `deep`, `security`, and `embedded` execution profiles remain stable.','Change Safe is an active deterministic Core consumer for canonical JSON/fingerprint primitives, while its `.codex-change-safe.json` delivery policy remains product-owned and deliberately separate from Core `.codex-safe.json` Policy Schema v3.\n\nThe existing `quick`, `standard`, `deep`, `security`, and `embedded` execution profiles remain stable.');
          fs.writeFileSync('README.md',readme);
          let zh=fs.readFileSync('README.zh-CN.md','utf8');
          zh=zh.replace('| [Codex Review Service](https://github.com/jiying2007/codex-review-service) | 服务端 GitLab Self-Managed MR 审查、发布、门禁与审计 |','| [Codex Change Safe](https://github.com/jiying2007/codex-pr) | 开发者侧 GitHub/GitLab 交付授权、Merge Readiness 与 Change Receipt v1 |\n| [Codex Review Service](https://github.com/jiying2007/codex-review-service) | 服务端 GitLab Self-Managed MR 审查、发布、门禁与审计 |');
          zh=zh.replace('**Codex PR Safe 已退役。** 不会提供替代的 PR/MR 描述生成器；PR/MR 创建和元数据管理交给 SCM 原生 UI、CLI 或 API，Codex Commit Safe 也明确不增加 PR/MR 描述生成功能。','**Codex PR Safe 已退役。** 旧的模型生成 PR 描述身份不会恢复。**Codex Change Safe** 是新的交付产品：以确定性的 GitHub/GitLab PR/MR 授权与 Merge Readiness 接替交付阶段，默认模型调用为 0。');
          zh=zh.replace('开发者侧提交前审查使用 Codex Review Safe，Commit Message 生成使用 Codex Commit Safe，服务端 GitLab MR 审查使用 Codex Review Service，CI / Build / Test 失败根因分析使用 Codex Diagnose Safe。','开发者侧提交前审查使用 Codex Review Safe，Commit Message 生成使用 Codex Commit Safe，PR/MR 交付授权使用 Codex Change Safe，服务端 GitLab MR 审查使用 Codex Review Service，CI / Build / Test 失败根因分析使用 Codex Diagnose Safe。');
          zh=zh.replace('四个活跃 Consumer 统一以 `src/codex-safe-core` Git submodule','五个活跃 Consumer 统一以 `src/codex-safe-core` Git submodule');
          zh=zh.replace('Core 变更只有在四个活跃 Consumer 都 coordinated-repin','Core 变更只有在五个活跃 Consumer 都 coordinated-repin');
          zh=zh.replace('## Core 4.9 Quality Platform v3','Change Safe 是 active deterministic Core consumer，用于复用 canonical JSON/fingerprint primitive；其 `.codex-change-safe.json` 交付策略仍由产品自身拥有，并刻意与 Core `.codex-safe.json` Policy Schema v3 分离。\n\n## Core 4.9 Quality Platform v3');
          fs.writeFileSync('README.zh-CN.md',zh);
          let cg=fs.readFileSync('docs/CONSUMER_GUIDE.md','utf8');
          cg=cg.replace('Active consumers are Codex Review Safe, Codex Commit Safe, Codex Review Service and Codex Diagnose Safe. Codex PR Safe is retired. It is not an active consumer, there is no successor PR/MR-description generator, and the former `pr` policy/prompt surface is rejected rather than retained as compatibility.','Active consumers are Codex Change Safe, Codex Review Safe, Codex Commit Safe, Codex Review Service and Codex Diagnose Safe. Codex PR Safe is retired as the former model-generated PR-description identity; Change Safe is a distinct deterministic delivery product and does not restore that narrative generator.');
          cg=cg.replace('Repin Review, Commit, Review Service and Diagnose to that SHA.','Repin Change, Review, Commit, Review Service and Diagnose to that SHA.');
          cg=cg.replace('Run every active consumer CI.','Run every active consumer CI, including Change Safe provider/Extension Host gates.');
          cg=cg.replace('same exact Core pin for all four active consumer SHAs','same exact Core pin for all five active consumer SHAs');
          cg=cg.replace('PR/MR narrative generation and SCM-side PR/MR creation are not active Family capabilities.','Model-generated PR/MR narrative remains a non-goal. SCM-side PR/MR delivery authorization is owned by Codex Change Safe and remains outside Core runtime ownership. Change Safe delivery policy is product-owned in `.codex-change-safe.json`, separate from Core `.codex-safe.json` Policy Schema v3.');
          cg=cg.replace('Family Compatibility additionally validates the four active exact consumer pins','Family Compatibility additionally validates the five active exact consumer pins');
          fs.writeFileSync('docs/CONSUMER_GUIDE.md',cg);
          let cgzh=fs.readFileSync('docs/CONSUMER_GUIDE.zh-CN.md','utf8');
          cgzh=cgzh.replace('当前四个活跃 Consumer 是 Codex Review Safe、Codex Commit Safe、Codex Review Service、Codex Diagnose Safe。Codex PR Safe 已退役，不再属于活跃 Consumer；不会提供替代的 PR/MR 描述生成器，原 `pr` Policy/Prompt surface 直接拒绝，不保留兼容表面。','当前五个活跃 Consumer 是 Codex Change Safe、Codex Review Safe、Codex Commit Safe、Codex Review Service、Codex Diagnose Safe。Codex PR Safe 仅作为旧的模型生成 PR 描述身份退役；Change Safe 是独立的确定性交付产品，不恢复旧 Narrative Generator。');
          cgzh=cgzh.replace('Review、Commit、Review Service、Diagnose 同步 repin 到该 SHA。','Change、Review、Commit、Review Service、Diagnose 同步 repin 到该 SHA。');
          cgzh=cgzh.replace('运行四个活跃 Consumer 各自完整 CI。','运行五个活跃 Consumer 各自完整 CI，包括 Change Safe 的 Provider / Extension Host 门禁。');
          cgzh=cgzh.replace('`FAMILY_MANIFEST.json` 中四个活跃 Consumer','`FAMILY_MANIFEST.json` 中五个活跃 Consumer');
          cgzh=cgzh.replace('PR/MR Narrative 与 SCM 侧 PR/MR 创建不属于活跃 Family 能力。','模型生成 PR/MR Narrative 仍是明确非目标。SCM 侧 PR/MR 交付授权由 Codex Change Safe 拥有，并保持在 Core runtime 边界之外；Change Safe 的 `.codex-change-safe.json` 由产品自身拥有，与 Core `.codex-safe.json` Policy Schema v3 分离。');
          fs.writeFileSync('docs/CONSUMER_GUIDE.zh-CN.md',cgzh);
          let changelog=fs.readFileSync('CHANGELOG.md','utf8');
          changelog=changelog.replace('# Changelog\n','# Changelog\n\n## 4.9.7\n\n- add Codex Change Safe as the fifth active exact-pin Core consumer;\n- remove the `codex-pr` repository path from retired-product governance while keeping the legacy Codex PR Safe identity retired;\n- extend atomic Family snapshot, ownership boundary, golden replay, compatibility CI, manifest and coordinated repin orchestration to Change Safe;\n- document Change Safe as deterministic delivery authorization with product-owned `.codex-change-safe.json`, leaving Safe Contract v2, Policy Schema v3 and Receipt contracts unchanged.\n');
          fs.writeFileSync('CHANGELOG.md',changelog);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: govern Change Safe as fifth Core consumer'
          git rm .github/workflows/_change-safe-family-bootstrap.yml
          git commit -m 'chore: remove family bootstrap workflow'
          git push origin HEAD:chore/change-safe-family-v4.9.7
