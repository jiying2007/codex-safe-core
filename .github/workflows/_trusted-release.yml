name: Trusted Release

on:
  workflow_run:
    workflows: ["Release Validation"]
    types: [completed]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: trusted-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Verify validated SHA is still canonical main
        shell: bash
        run: |
          set -euo pipefail
          validated_sha='${{ github.event.workflow_run.head_sha }}'
          test "$(git rev-parse HEAD)" = "$validated_sha"
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test -n "$remote_main"
          test "$remote_main" = "$validated_sha" || {
            echo "Validated SHA ${validated_sha} is no longer current main (${remote_main}); refusing stale release." >&2
            exit 1
          }
      - name: Resolve immutable release decision
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./core-contract.json').coreVersion")
          test "$version" = "$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Formal release ${tag} already exists; no new publication is required."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            test "$(git rev-list -n 1 "$tag")" = "$VALIDATED_SHA" || {
              echo "Unreleased immutable tag ${tag} does not point to validated SHA ${VALIDATED_SHA}." >&2
              exit 1
            }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Re-verify reproducible package and Core gates
        if: steps.decision.outputs.publish == 'true'
        run: |
          npm run check:contract
          npm run check:reproducible
          npm run ci
      - name: Package, manifests, SBOM and checksums
        if: steps.decision.outputs.publish == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > /tmp/pack.json
          artifact=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pack.json','utf8'));process.stdout.write(x[0].filename)")
          test -s "$artifact"
          node scripts/generate-sbom.js SBOM.spdx.json
          test -s SBOM.spdx.json
          cp core-contract.json CORE_CONTRACT.json
          cp core-ownership-manifest.json CORE_OWNERSHIP_MANIFEST.json
          sha256sum "$artifact" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Attest immutable release files
        if: steps.decision.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            SBOM.spdx.json
            CORE_CONTRACT.json
            CORE_OWNERSHIP_MANIFEST.json
            SHA256SUMS
      - name: Ensure immutable release tag
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.decision.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$VALIDATED_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$VALIDATED_SHA" >/dev/null
          fi
      - name: Publish immutable GitHub Release
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.decision.outputs.tag }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT"
          gh release create "$RELEASE_TAG" "$ARTIFACT" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json SHA256SUMS --title "Codex Safe Core ${{ steps.decision.outputs.version }}" --generate-notes --verify-tag
