name: Trusted Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Verify reproducible package
        run: npm run check:reproducible
      - name: Package, manifests, SBOM and checksums
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm run ci
          npm pack --ignore-scripts --json > /tmp/pack.json
          artifact=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pack.json','utf8'));process.stdout.write(x[0].filename)")
          test -s "$artifact"
          node scripts/generate-sbom.js SBOM.spdx.json
          test -s SBOM.spdx.json
          cp core-contract.json CORE_CONTRACT.json
          cp core-ownership-manifest.json CORE_OWNERSHIP_MANIFEST.json
          sha256sum "$artifact" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Attest immutable release files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            SBOM.spdx.json
            CORE_CONTRACT.json
            CORE_OWNERSHIP_MANIFEST.json
            SHA256SUMS
      - name: Ensure immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets will not be overwritten." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$ARTIFACT" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json SHA256SUMS --title "Codex Safe Core ${{ inputs.version }}" --generate-notes --verify-tag
