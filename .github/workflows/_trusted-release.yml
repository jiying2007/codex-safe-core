name: Trusted Release

on:
  workflow_run:
    workflows: ["Release Validation"]
    types: [completed]

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: trusted-release-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact validated main SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.22.2'
      - name: Verify validated SHA is still canonical main
        shell: bash
        run: |
          set -euo pipefail
          validated_sha='${{ github.event.workflow_run.head_sha }}'
          test "$(git rev-parse HEAD)" = "$validated_sha"
          remote_main=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test -n "$remote_main"
          test "$remote_main" = "$validated_sha" || {
            echo "Validated SHA ${validated_sha} is no longer current main (${remote_main}); refusing stale release." >&2
            exit 1
          }
      - name: Require exact main push CI Gate and real security job before any release
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The validation workflow alone does not run the real CodeQL CI gate.
          ci_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const runs=JSON.parse(s).workflow_runs||[];const run=runs.find(r=>r.head_sha===process.env.VALIDATED_SHA&&r.head_branch==="main"&&r.event==="push"&&r.status==="completed"&&r.conclusion==="success");if(run)process.stdout.write(String(run.id));})')"
          [[ "$ci_run" =~ ^[0-9]+$ ]] || { echo "Missing successful exact-SHA main CI for ${VALIDATED_SHA}" >&2; exit 1; }
          GH_CI_RUN="$ci_run" gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${ci_run}/jobs?per_page=100" --jq '.jobs[] | [.name, .status, .conclusion] | @tsv' > /tmp/core-ci-jobs.tsv
          node - <<'NODE'
          const fs=require('fs');
          const jobs=fs.readFileSync('/tmp/core-ci-jobs.tsv','utf8').trim().split('\n').map(line=>line.split('\t'));
          const success=name=>jobs.some(row=>row[0]===name && row[1]==='completed' && row[2]==='success');
          if(!success('CI Gate') || !success('security / codeql')) throw new Error('Exact main CI must include successful CI Gate and real CodeQL security job.');
          NODE
      - name: Resolve immutable release decision
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./core-contract.json').coreVersion")
          test "$version" = "$(node -p "require('./package.json').version")"
          parent_version=''
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            parent_version=$(git show HEAD^:core-contract.json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>process.stdout.write(String(JSON.parse(s).coreVersion||'')))")
          fi
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            tag_sha=$(git ls-remote origin "refs/tags/${tag}" | awk '{print $1}')
            test -n "$tag_sha"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')" = true || {
              echo "Existing formal release ${tag} is not immutable." >&2
              exit 1
            }
            if [[ "$tag_sha" != "$VALIDATED_SHA" ]]; then
              if [[ -n "$parent_version" && "$parent_version" == "$version" ]]; then
                # A governance-only main change may reuse the release only when
                # exact released runtime and surface identity are proven equal.
                git fetch --quiet origin "refs/tags/${tag}:refs/tags/${tag}"
                canonical_sha="$(git rev-list -n 1 "$tag")"
                test "$canonical_sha" = "$tag_sha" || { echo 'Unexpected tag object identity' >&2; exit 1; }
                git merge-base --is-ancestor "$canonical_sha" HEAD || { echo 'Existing release is not an ancestor of main' >&2; exit 1; }
                tmp="$(mktemp -d)"
                gh release verify "$tag"
                gh release download "$tag" --pattern CORE_DIGESTS.json --dir "$tmp"
                gh release verify-asset "$tag" "$tmp/CORE_DIGESTS.json"
                node scripts/core-digests.js . --output "$tmp/current.json"
                node - "$tmp/CORE_DIGESTS.json" "$tmp/current.json" <<'NODE'
          const fs=require('fs');const [releasedPath,currentPath]=process.argv.slice(2);
          const released=JSON.parse(fs.readFileSync(releasedPath,'utf8')),current=JSON.parse(fs.readFileSync(currentPath,'utf8'));
          if(released.runtimeDigest!==current.runtimeDigest || released.surfaceManifestDigest!==current.surfaceManifestDigest) throw Error('Existing tag does not match exact current runtime and surface digest. Bump the Core version.');
          NODE
                rm -rf "$tmp"
                echo "Core ${version} has runtime-identical governance-only main changes; retaining exact verified release ${tag_sha}."
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "reason=no-version-change" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Existing formal release ${tag} points to ${tag_sha}, expected ${VALIDATED_SHA}; version changed or parent version could not prove a no-op." >&2
              exit 1
            fi
            release_verified=false
            for attempt in {1..12}; do
              if gh release verify "$tag"; then
                release_verified=true
                break
              fi
              echo "Release attestation for ${tag} is not visible yet (attempt ${attempt}/12); retrying."
              sleep 5
            done
            test "$release_verified" = true || {
              echo "Existing formal release ${tag} attestation did not become verifiable." >&2
              exit 1
            }
            echo "Formal release ${tag} already exists, points to validated main, and is immutable; no new publication is required."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "reason=exact-existing-release" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
            test "$(git rev-list -n 1 "$tag")" = "$VALIDATED_SHA" || {
              echo "Unreleased tag ${tag} does not point to validated SHA ${VALIDATED_SHA}." >&2
              exit 1
            }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "reason=new-release" >> "$GITHUB_OUTPUT"
      - name: Re-verify reproducible package and Core gates
        if: steps.decision.outputs.publish == 'true'
        run: |
          npm run check:contract
          npm run check:reproducible
          npm run ci
      - name: Package, manifests, digests, SBOM and checksums
        if: steps.decision.outputs.publish == 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --json > /tmp/pack.json
          artifact=$(node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/pack.json','utf8'));process.stdout.write(x[0].filename)")
          test -s "$artifact"
          node scripts/generate-sbom.js SBOM.spdx.json
          node scripts/core-digests.js . --output CORE_DIGESTS.json
          test -s SBOM.spdx.json
          test -s CORE_DIGESTS.json
          cat CORE_DIGESTS.json
          cp core-contract.json CORE_CONTRACT.json
          cp core-ownership-manifest.json CORE_OWNERSHIP_MANIFEST.json
          sha256sum "$artifact" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json CORE_DIGESTS.json > SHA256SUMS
          sha256sum --check SHA256SUMS
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Attest immutable release files
        if: steps.decision.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.package.outputs.artifact }}
            SBOM.spdx.json
            CORE_CONTRACT.json
            CORE_OWNERSHIP_MANIFEST.json
            CORE_DIGESTS.json
            SHA256SUMS
      - name: Reconfirm main SHA at publication boundary
        if: steps.decision.outputs.publish == 'true'
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$VALIDATED_SHA" || { echo 'main moved during trusted release; refusing stale tag.' >&2; exit 1; }
      - name: Ensure release tag
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.decision.outputs.tag }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --refs origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$VALIDATED_SHA"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${RELEASE_TAG}" -f sha="$VALIDATED_SHA" >/dev/null
          fi
      - name: Publish and verify immutable GitHub Release
        if: steps.decision.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.decision.outputs.tag }}
          ARTIFACT: ${{ steps.package.outputs.artifact }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT"
          gh release create "$RELEASE_TAG" "$ARTIFACT" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json CORE_DIGESTS.json SHA256SUMS --title "Codex Safe Core ${{ steps.decision.outputs.version }}" --generate-notes --verify-tag
          immutable=false
          for attempt in {1..12}; do
            immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.immutable')
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || {
            echo "Published release ${RELEASE_TAG} did not become immutable." >&2
            exit 1
          }
          release_verified=false
          for attempt in {1..12}; do
            assets_verified=true
            if gh release verify "$RELEASE_TAG"; then
              for asset in "$ARTIFACT" SBOM.spdx.json CORE_CONTRACT.json CORE_OWNERSHIP_MANIFEST.json CORE_DIGESTS.json SHA256SUMS; do
                if ! gh release verify-asset "$RELEASE_TAG" "$asset"; then
                  assets_verified=false
                  break
                fi
              done
              if [[ "$assets_verified" == true ]]; then
                release_verified=true
                break
              fi
            fi
            echo "Release/asset attestation for ${RELEASE_TAG} is not fully visible yet (attempt ${attempt}/12); retrying."
            sleep 5
          done
          test "$release_verified" = true || {
            echo "Published release ${RELEASE_TAG} attestation did not become fully verifiable." >&2
            exit 1
          }
      - name: Dispatch coordinated active-consumer upgrade
        if: steps.decision.outputs.reason != 'no-version-change'
        env:
          GH_TOKEN: ${{ secrets.FAMILY_BOT_TOKEN }}
          CORE_SHA: ${{ github.event.workflow_run.head_sha }}
          CORE_VERSION: ${{ steps.decision.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'FAMILY_BOT_TOKEN is required after an immutable Core release.' >&2; exit 2; }
          gh workflow run "Family Upgrade" --repo "$GITHUB_REPOSITORY" --ref main -f core_sha="$CORE_SHA" -f core_version="$CORE_VERSION"
