name: Stage Core 4.14 Changelog

on:
  push:
    branches: [feat/release-aware-family-4.14.0]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Prepend 4.14.0 release entry
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const file='CHANGELOG.md';
          const text=fs.readFileSync(file,'utf8').replace(/\r\n/g,'\n');
          if(text.includes('## 4.14.0 - 2026-09-03')) process.exit(0);
          const entry=`## 4.14.0 - 2026-09-03\n\n- Promote Family Registry v1, release-aware Atomic Family Snapshot v2, Family Manifest v4, Family Status v1 and Distribution Receipt v1 without changing Safe Contract v2, Policy Schema v4, Runtime/Provider Contract v3, Review Receipt v5, Commit Receipt v4, Diagnosis Receipt v2 or Quality Platform v3.\n- Require every consumer Core gitlink change to advance the consumer by exactly one patch product version and publish an exact immutable product Release; source-only Core repins can no longer make Family Freshness green.\n- Freeze exact consumer release tag/tag-SHA/assets and required distribution evidence: Marketplace receipts for Review/Commit/Change, released GHCR digest for Review Service and immutable GitHub Release distribution for Diagnose.\n- Make Family Upgrade wait for every consumer Release and distribution boundary before Family Freshness, and make three-platform Family Compatibility generate release-aware Manifest v4 evidence.\n- Add reusable exact-SHA Consumer Release Integrity and immutable Distribution Receipt workflows, machine-readable Family Status, canonical Family Registry topology and Core security-extended CodeQL.\n- Keep main branch server-side protection intentionally deferred at the current product stage; workflows do not claim an unbypassable Ruleset while it is disabled.\n\n`;
          const marker='# Changelog\n\n';
          if(!text.startsWith(marker)) throw new Error('Unexpected CHANGELOG heading');
          fs.writeFileSync(file,marker+entry+text.slice(marker.length));
          NODE
          if git diff --quiet -- CHANGELOG.md; then exit 0; fi
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m 'docs(family): document Core 4.14.0 release-aware family'
          git push origin HEAD:feat/release-aware-family-4.14.0
