name: Finalize Core v4.9.6 once
on:
  push:
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/fix-performance-attestation-v4.9.6'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-performance-attestation-v4.9.6
          persist-credentials: true
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Finalize version identity and targeted verification
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='4.9.6';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('core-contract.json','utf8'));
          contract.coreVersion='4.9.6';
          fs.writeFileSync('core-contract.json',JSON.stringify(contract,null,2)+'\n');
          for(const p of ['docs/EFFICIENCY_CONTRACT.md','docs/EFFICIENCY_CONTRACT.zh-CN.md','docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md']){
            let s=fs.readFileSync(p,'utf8').replaceAll('4.9.5','4.9.6');
            fs.writeFileSync(p,s);
          }
          const changelog=fs.readFileSync('CHANGELOG.md','utf8');
          const header='# Changelog\n\n';
          if(!changelog.startsWith(header))throw new Error('unexpected changelog header');
          const entry=`## 4.9.6 - 2026-08-30\n\n### Performance evidence provenance\n\n- Attest each new immutable Performance Trend snapshot with GitHub build provenance before publishing its release.\n- Make repeated runs for an existing Core evidence tag download and verify the canonical immutable asset instead of comparing a fresh sample against an immutable remote asset.\n- Add bounded attestation-propagation verification matching the Family release evidence model.\n- Keep Safe Contract, policy, receipt, provider, quality-platform and consumer product semantics unchanged.\n\n`;
          fs.writeFileSync('CHANGELOG.md',header+entry+changelog.slice(header.length));
          NODE
          node --test test/release-workflow.test.js test/performance-budget.test.js test/performance-snapshot.test.js
          node scripts/verify-core-contract.js
          node scripts/verify-actions-pins.js .github/workflows
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add package.json core-contract.json CHANGELOG.md docs/EFFICIENCY_CONTRACT.md docs/EFFICIENCY_CONTRACT.zh-CN.md docs/QUALITY_PLATFORM.md docs/QUALITY_PLATFORM.zh-CN.md
          git commit -m 'chore(core): finalize v4.9.6 evidence identity'
          git push origin HEAD:fix-performance-attestation-v4.9.6
