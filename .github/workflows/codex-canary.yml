name: Codex CLI Canary

on:
  pull_request:
    paths:
      - 'safe-contract.js'
      - 'codex-cli.js'
      - 'scripts/codex-canary.js'
      - '.github/workflows/codex-canary.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-cli-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858 # post-v7.0.0 GHSA-3jxr-9vmj-r5cp fix
        with:
          node-version: '22'
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Verify Safe Contract capabilities and strict config
        run: node scripts/codex-canary.js
