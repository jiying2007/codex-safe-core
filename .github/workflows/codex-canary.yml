name: Codex CLI Canary

on:
  pull_request:
    paths:
      - 'core-contract.json'
      - 'safe-contract.js'
      - 'codex-cli.js'
      - 'scripts/codex-canary.js'
      - 'scripts/codex-behavioral-canary.js'
      - 'scripts/write-codex-compat-record.js'
      - '.github/workflows/codex-canary.yml'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-cli-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Verify Safe Contract capabilities and strict config
        run: node scripts/codex-canary.js

  behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Live filesystem/network negative behavior check
        if: env.OPENAI_API_KEY != ''
        run: node scripts/codex-behavioral-canary.js
      - name: Record credentialless behavioral canary state
        if: env.OPENAI_API_KEY == ''
        run: echo "Live behavioral canary not executed because OPENAI_API_KEY is not configured; capability canary remains mandatory."

  history:
    if: github.event_name != 'pull_request'
    needs: capability
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Reconfirm latest Codex capability and write immutable record
        run: |
          npm install --global @openai/codex@latest
          node scripts/codex-canary.js
          node scripts/write-codex-compat-record.js CODEX_CLI_COMPATIBILITY.json
      - name: Persist compatibility record as a historical release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./CODEX_CLI_COMPATIBILITY.json').codexCliVersion")"
          safe="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '_')"
          asset="codex-cli-${safe}.json"
          mv CODEX_CLI_COMPATIBILITY.json "$asset"
          tag="codex-cli-compatibility-history"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "Codex CLI compatibility history" --notes "Append-only compatibility records produced by the mandatory multi-platform Safe Contract canary."
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$asset"; then
            echo "compatibility record already exists for $version"
          else
            gh release upload "$tag" "$asset"
          fi
