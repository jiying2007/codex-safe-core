name: Codex CLI Canary

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-cli-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Verify Safe Contract capabilities and strict config
        run: node scripts/codex-canary.js

  behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ${{ secrets.CODEX_CANARY_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      CODEX_CANARY_MODEL: ${{ vars.CODEX_CANARY_MODEL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Install latest Codex CLI
        run: npm install --global @openai/codex@latest
      - name: Require protected live canary credential
        if: env.OPENAI_API_KEY == ''
        shell: bash
        run: |
          echo 'Scheduled/manual Codex behavioral canary requires CODEX_CANARY_OPENAI_API_KEY (preferred) or OPENAI_API_KEY.' >&2
          exit 1
      - name: Live filesystem/network negative behavior check
        run: node scripts/codex-behavioral-canary.js
      - name: Live model quality smoke
        run: node scripts/codex-quality-canary.js

  history:
    needs: [capability, behavioral]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Reconfirm latest Codex capability and write immutable record
        run: |
          npm install --global @openai/codex@latest
          node scripts/codex-canary.js
          node scripts/write-codex-compat-record.js CODEX_CLI_COMPATIBILITY.json
      - name: Persist compatibility record as one immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./CODEX_CLI_COMPATIBILITY.json').codexCliVersion")"
          safe="$(printf '%s' "$version" | tr -c '0-9A-Za-z._-' '_')"
          core_version="$(node -p "require('./core-contract.json').coreVersion")"
          core_short="${GITHUB_SHA:0:12}"
          asset="codex-cli-${safe}.json"
          mv CODEX_CLI_COMPATIBILITY.json "$asset"
          tag="codex-cli-compat-v${safe}-core-v${core_version}-${core_short}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "immutable compatibility evidence already exists: $tag"
          else
            gh release create "$tag" "$asset" --target "$GITHUB_SHA" --title "Codex CLI ${version} compatibility on Core ${core_version}" --notes "Immutable compatibility evidence produced only after mandatory multi-platform capability checks and the protected live behavioral/quality canary."
          fi
          immutable=false
          for attempt in {1..12}; do
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')"
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || { echo "Compatibility release ${tag} is not immutable." >&2; exit 1; }
          gh release verify "$tag"
          gh release verify-asset "$tag" "$asset"
