name: Consumer Release Integrity

on:
  workflow_call:
    inputs:
      expected_sha:
        required: true
        type: string
      product:
        required: true
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      PRODUCT: ${{ inputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact immutable release and every attested asset
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'expected_sha must be exact' >&2; exit 2; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid product version: $version" >&2; exit 2; }
          tag="v${version}"
          release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')"
          object_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.type')"
          if [[ "$object_type" == tag ]]; then
            release_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${release_sha}" --jq '.object.sha')"
          fi
          test "$release_sha" = "$EXPECTED_SHA" || { echo "$PRODUCT release tag ${tag} points to ${release_sha}, expected ${EXPECTED_SHA}" >&2; exit 1; }
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')" = true || { echo "${tag} is not immutable" >&2; exit 1; }
          gh release verify "$tag"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gh release download "$tag" --dir "$tmp"
          shopt -s nullglob
          assets=("$tmp"/*)
          ((${#assets[@]} > 0)) || { echo "Release ${tag} has no assets." >&2; exit 1; }
          for asset in "${assets[@]}"; do gh release verify-asset "$tag" "$asset"; done
