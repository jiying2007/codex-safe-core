name: Stage Core 4.14.4
on:
  push:
    branches: [fix/changelog-guard-shape-4.14.4]
    paths: [.github/workflows/_stage-core-4.14.4.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: true, fetch-depth: 0 }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '24.19.0' }
      - name: Prepare 4.14.4 and validate
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version='4.14.4';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('core-contract.json','utf8'));contract.coreVersion='4.14.4';fs.writeFileSync('core-contract.json',JSON.stringify(contract,null,2)+'\n');
          for(const file of ['docs/EFFICIENCY_CONTRACT.md','docs/EFFICIENCY_CONTRACT.zh-CN.md','docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md']){
            let text=fs.readFileSync(file,'utf8');text=text.replace(/Core v?4\.14\.3/g,m=>m.includes('v')?'Core v4.14.4':'Core 4.14.4');fs.writeFileSync(file,text);
          }
          const file='CHANGELOG.md',text=fs.readFileSync(file,'utf8'),marker='# Changelog\n\n';
          const entry='## 4.14.4 - 2026-09-03\n\n- Align the shared release-bearing Consumer Guard with canonical repin Changelog behavior: consumers may use either `# Changelog` followed immediately by the current release heading or a current release heading at byte zero.\n- Continue failing closed when an older release heading precedes the current version or the current version is buried later in the file.\n- Add deterministic regression coverage for titled and titleless consumer Changelog shapes. Family Registry v1, Snapshot v2, Manifest v4, Status v1 and Distribution Receipt v1 remain unchanged.\n\n';
          if(!text.includes('## 4.14.4 - 2026-09-03'))fs.writeFileSync(file,text.startsWith(marker)?marker+entry+text.slice(marker.length):entry+text);
          NODE
          npm run ci
          git config user.name codex-safe-family-bot
          git config user.email codex-safe-family-bot@users.noreply.github.com
          git add package.json core-contract.json CHANGELOG.md docs/EFFICIENCY_CONTRACT.md docs/EFFICIENCY_CONTRACT.zh-CN.md docs/QUALITY_PLATFORM.md docs/QUALITY_PLATFORM.zh-CN.md
          git diff --cached --quiet && exit 0
          git commit -m 'chore(release): prepare Core 4.14.4'
          git push origin HEAD:fix/changelog-guard-shape-4.14.4
