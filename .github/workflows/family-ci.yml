name: Family Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

concurrency:
  group: family-compat-main
  cancel-in-progress: true

jobs:
  family:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Validate Core
        run: npm run ci
      - name: Clone active consumer repositories
        shell: bash
        run: |
          set -euo pipefail
          mkdir family
          for repo in codex-commit codex-review codex-review-service codex-diagnose; do
            git clone --quiet --recurse-submodules "https://github.com/jiying2007/${repo}.git" "family/${repo}"
          done
      - name: Verify all active consumers pin this Core
        shell: bash
        run: |
          set -euo pipefail
          core_sha="$(git rev-parse HEAD)"
          for repo in codex-commit codex-review codex-review-service codex-diagnose; do
            pinned="$(git -C "family/${repo}" ls-files --stage src/codex-safe-core | awk '{print $2}')"
            test -n "$pinned"
            test "$pinned" = "$core_sha" || { echo "${repo} pins ${pinned}, expected ${core_sha}" >&2; exit 1; }
            node scripts/verify-actions-pins.js "family/${repo}/.github/workflows"
            node scripts/verify-non-goals.js "family/${repo}"
          done
      - name: Verify consumers do not reimplement Core-owned primitives
        run: node scripts/verify-consumer-boundaries.js family
      - name: Replay Family golden corpus through every active consumer Core
        run: node scripts/family-golden.js family/codex-commit/src/codex-safe-core family/codex-review/src/codex-safe-core family/codex-review-service/src/codex-safe-core family/codex-diagnose/src/codex-safe-core
      - name: Install Linux Extension Host dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 || sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
      - name: Validate consumers
        shell: bash
        run: |
          set -euo pipefail
          for repo in codex-commit codex-review codex-review-service codex-diagnose; do
            echo "::group::${repo}"
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              (cd "family/${repo}" && xvfb-run -a npm run ci)
            else
              (cd "family/${repo}" && npm run ci)
            fi
            echo "::endgroup::"
          done

  manifest:
    needs: family
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@94196ee1d15439c1b6651cd87ef14e88ec435966
        with:
          node-version: '22.22.2'
      - name: Clone exact active consumer heads
        shell: bash
        run: |
          set -euo pipefail
          mkdir family
          for repo in codex-commit codex-review codex-review-service codex-diagnose; do
            git clone --quiet --recurse-submodules "https://github.com/jiying2007/${repo}.git" "family/${repo}"
          done
      - name: Generate canonical Family manifest
        run: node scripts/generate-family-manifest.js family FAMILY_MANIFEST.json
      - name: Attest Family manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: FAMILY_MANIFEST.json
      - name: Upload Family manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-safe-family-manifest
          path: FAMILY_MANIFEST.json
          if-no-files-found: error
      - name: Publish and verify immutable digest-addressed Family manifest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./core-contract.json').coreVersion")"
          digest="$(node -p "require('./FAMILY_MANIFEST.json').manifestDigest")"
          tag="family-manifest-v${version}-${digest:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "digest-addressed Family manifest release already exists: $tag"
          else
            gh release create "$tag" FAMILY_MANIFEST.json --target "$GITHUB_SHA" --title "Codex Safe Family manifest ${version} ${digest:0:12}" --notes "Machine-generated and provenance-attested exact Core/consumer manifest. This release is historical family evidence, not an end-user product release."
          fi
          immutable=false
          for attempt in {1..12}; do
            immutable=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.immutable')
            [[ "$immutable" == true ]] && break
            sleep 5
          done
          test "$immutable" = true || {
            echo "Family manifest release ${tag} is not immutable." >&2
            exit 1
          }
          gh release verify "$tag"
          gh release verify-asset "$tag" FAMILY_MANIFEST.json
