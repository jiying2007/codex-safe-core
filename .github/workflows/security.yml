name: Security

on:
  workflow_call:
  schedule:
    - cron: '7 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
          output: codeql-results
      - name: Audit GitHub Actions YAML with pinned, offline zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github/workflows
          collect: workflows
          version: '1.32.0'
          online-audits: 'false'
          persona: regular
          min-severity: high
          min-confidence: high
          advanced-security: 'true'
      - name: Block high and critical findings in CI Gate
        if: ${{ always() }}
        run: node scripts/codeql-findings-gate.js codeql-results
      - name: Preserve actual CodeQL SARIF
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: codeql-results/*.sarif
          if-no-files-found: error
