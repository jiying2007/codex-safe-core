name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 2 }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: '22.22.2' }
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./core-contract.json').coreVersion")
          test "$version" = "$(node -p "require('./package.json').version")"
          tag="v${version}"
          previous=$(git show HEAD^:package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{try{process.stdout.write(JSON.parse(s).version||'')}catch{}})" || true)
          publish=true
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" && "$previous" == "$version" ]]; then
            if git ls-remote --exit-code --refs origin "refs/tags/${tag}" >/dev/null 2>&1; then publish=false; fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.publish == 'true'
        run: npm run check:contract

  runtime:
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2','24.19.0']
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with: { node-version: ${{ matrix.node }} }
      - run: npm run ci

  publish:
    needs: [validate, runtime]
    if: needs.validate.outputs.publish == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: $/.github/workflows/_trusted-release.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      tag: ${{ needs.validate.outputs.tag }}
