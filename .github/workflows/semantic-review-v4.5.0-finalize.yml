name: Finalize Core 4.5 semantic review contracts

on:
  push:
    branches: [semantic-review-v4.5.0]

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'feat: finalize Core 4.5 semantic review platform' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: semantic-review-v4.5.0
          fetch-depth: 2
      - uses: actions/setup-node@e51e5fe84fc33b4c73ebe40526b2694712b5b858
        with:
          node-version: '22.22.2'
      - name: Synchronize Core 4.5 identity and governance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='4.5.0';
          if(!pkg.files.includes('semantic-review.js')) pkg.files.splice(pkg.files.indexOf('quality-platform.js')+1,0,'semantic-review.js');
          pkg.scripts['check:syntax']=pkg.scripts['check:syntax'].replace('node --check quality-platform.js','node --check quality-platform.js && node --check semantic-review.js');
          if(!pkg.scripts.test.includes('test/semantic-review.test.js')) pkg.scripts.test=pkg.scripts.test.replace('test/quality-platform.test.js','test/quality-platform.test.js test/semantic-review.test.js');
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const contract=JSON.parse(fs.readFileSync('core-contract.json','utf8'));
          contract.coreVersion='4.5.0';
          contract.qualityPlatformVersion=2;
          contract.impactEvidenceVersion=2;
          contract.semanticReviewVersion=1;
          contract.evidenceManifestVersion=1;
          contract.reviewKeyVersion=1;
          contract.findingLedgerVersion=1;
          contract.findingVerificationVersion=1;
          fs.writeFileSync('core-contract.json',JSON.stringify(contract,null,2)+'\n');
          const ownership=JSON.parse(fs.readFileSync('core-ownership-manifest.json','utf8'));
          for(const item of ['semantic-review-evidence-contracts','evidence-manifest-digests','stable-review-keys','stable-finding-identities','finding-resolution-primitives','evidence-backed-finding-verification','repeated-review-stability']) if(!ownership.coreOwned.includes(item)) ownership.coreOwned.push(item);
          for(const item of ['buildEvidenceManifest','computeReviewKey','computeStableFindingId','validateEvidenceBackedFinding','compareFindingSets']) if(!ownership.consumerForbiddenImplementations.includes(item)) ownership.consumerForbiddenImplementations.push(item);
          fs.writeFileSync('core-ownership-manifest.json',JSON.stringify(ownership,null,2)+'\n');
          NODE
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.js'); s=p.read_text();
          if "...require('./semantic-review')" not in s:
              s=s.replace("  ...require('./quality-platform'),", "  ...require('./quality-platform'),\n  ...require('./semantic-review'),")
          p.write_text(s)
          p=Path('scripts/verify-core-contract.js'); s=p.read_text()
          s=s.replace("['qualityPlatformVersion','reviewProfileVersion','impactEvidenceVersion','analyzerFindingVersion','patchProposalVersion','familyManifestVersion']", "['qualityPlatformVersion','reviewProfileVersion','impactEvidenceVersion','analyzerFindingVersion','patchProposalVersion','semanticReviewVersion','evidenceManifestVersion','reviewKeyVersion','findingLedgerVersion','findingVerificationVersion','familyManifestVersion']")
          s=s.replace("assert.match(quality,/Core 4\\.4/);", "assert.match(quality,/Core 4\\.5/);")
          if "semantic review contracts" not in s:
              s=s.replace("assert.match(quality,/FAMILY_MANIFEST\\.json/);", "assert.match(quality,/FAMILY_MANIFEST\\.json/);\nassert.match(quality,/semantic review contracts/i);")
          p.write_text(s)
          entry='''\n## 4.5.0 - 2026-08-28\n\n### Semantic review platform\n\n- Add pure, product-agnostic semantic review contracts for immutable Evidence Manifests, stable Review Keys, stable Finding IDs, evidence-scoped human resolutions, evidence-backed finding verification, chunk-scoped evidence selection, and repeated-review stability.\n- Add ordinary C/C++ call-symbol extraction so products can resolve declaration/definition evidence for unchanged dependencies without letting Core perform repository I/O.\n- Keep Safe Contract v2, Policy Schema v3, Review/Commit Receipt v4, and product Git/network boundaries unchanged.\n'''
          p=Path('CHANGELOG.md'); s=p.read_text()
          if '\n## 4.5.0 - 2026-08-28\n' not in s: s=s.replace('# Changelog\n','# Changelog\n'+entry,1)
          p.write_text(s)
          for name in ['docs/QUALITY_PLATFORM.md','docs/QUALITY_PLATFORM.zh-CN.md']:
              p=Path(name); s=p.read_text().replace('Core 4.4','Core 4.5')
              if 'semantic review contracts' not in s.lower():
                  if name.endswith('.md') and not name.endswith('zh-CN.md'):
                      s += '''\n\n## Semantic review contracts\n\nCore 4.5 adds pure semantic review contracts: immutable Evidence Manifest digests, stable Review Keys, stable Finding IDs, evidence-scoped human resolutions, evidence-backed verification grades/statuses, chunk-scoped evidence selection, repeated-review stability, and C/C++ call-symbol extraction. Core never reads repositories or executes analyzers/models for these contracts; products acquire index-pinned evidence and pass bounded data into Core.\n'''
                  else:
                      s += '''\n\n## Semantic review contracts\n\nCore 4.5 新增纯函数语义 Review 契约：不可变 Evidence Manifest 摘要、稳定 Review Key、稳定 Finding ID、按证据摘要生效的人工 Resolution、证据支撑的验证等级/状态、按 chunk 选择证据、重复 Review 稳定性以及 C/C++ 调用符号提取。Core 不读取仓库，也不执行 analyzer/model；产品负责获取绑定 Git Index 的受限证据，再交给 Core。\n'''
              p.write_text(s)
          for name in ['README.md','README.zh-CN.md','ARCHITECTURE.md']:
              p=Path(name); s=p.read_text(); s=s.replace('4.4.1','4.5.0'); p.write_text(s)
          PY
      - name: Run full Core CI
        run: npm run ci
      - name: Push validated Core state
        shell: bash
        run: |
          set -euo pipefail
          git restore --staged --worktree .github/workflows/semantic-review-v4.5.0-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finalize Core 4.5 semantic review platform'
          git push origin HEAD:semantic-review-v4.5.0
